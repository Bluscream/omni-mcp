services:
  omni-mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: omni-mcp:latest
    container_name: omni-mcp
    restart: unless-stopped

    environment:
      # Required: HTTP mode refuses to start without a token.
      #   export OMNI_MCP_TOKEN="$(head -c 32 /dev/urandom | base64)"
      OMNI_MCP_TOKEN: ${OMNI_MCP_TOKEN:?set OMNI_MCP_TOKEN before starting}
      RUST_LOG: ${RUST_LOG:-info}

    ports:
      # Bound to loopback: this endpoint drives tools, do not publish it.
      - "127.0.0.1:8080:8080"

    volumes:
      - ../omni-mcp.toml:/etc/omni-mcp/omni-mcp.toml:ro
      # Mount whatever the filesystem tools should reach, and list the same
      # paths under tools.allowed_roots.
      # - /srv/projects:/srv/projects

    # Defined here rather than in the Dockerfile: HEALTHCHECK is a Docker-format
    # extension that OCI images ignore.
    healthcheck:
      test: ["CMD", "/usr/local/bin/omni-mcp", "--config", "/etc/omni-mcp/omni-mcp.toml", "check"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
