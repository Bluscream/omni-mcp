[package]
name = "omni-mcp"
version = "0.1.0"
edition = "2021"
description = "High-performance consolidated MCP router and native module suite in Rust"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
similar = "2.5"
quick-xml = "0.36"
regex = "1.10"
urlencoding = "2.1"
tower-http = { version = "0.5", features = ["cors"] }
toml = "0.8"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
too_many_lines = "deny"
