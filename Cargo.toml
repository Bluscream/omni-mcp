[package]
name = "omni-mcp"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Consolidated Model Context Protocol gateway: native Rust tools, supervised sidecars, and HTTP proxies behind one process"
license = "Unlicense"
repository = "https://github.com/blu/omni-mcp"
readme = "README.md"
keywords = ["mcp", "gateway", "llm", "jsonrpc"]
categories = ["command-line-utilities"]

[dependencies]
# Runtime
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "io-std", "io-util", "process", "sync", "time", "fs", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "0.8"

# Transport
axum = { version = "0.8", features = ["json"] }
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# CLI / diagnostics
clap = { version = "4.5", features = ["derive", "env"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Tool implementations
similar = "2.6"
quick-xml = "0.37"
regex = "1.11"
ignore = "0.4"
memchr = "2.7"
tempfile = "3.14"
hex = "0.4"
urlencoding = "2.1"

[dev-dependencies]
tokio = { version = "1.44", features = ["test-util"] }
tempfile = "3.14"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Deliberate allowances: this codebase is I/O bound glue, not a numeric kernel.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Hard failures: these represent real defects.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
too_many_lines = "deny"
