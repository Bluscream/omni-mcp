# -----------------------------------------------------------------------------
# Local MCP servers run as child processes
#
# Run these natively rather than through `distrobox enter` / `podman`: the
# per-call container wrapper is what produced the OverlayFS lock contention.
# `lazy = true` means the process starts on first use, not at IDE startup.
# -----------------------------------------------------------------------------
# [[sidecars]]
# name = "browser-control"
# command = "node"
# args = ["/path/to/browser-control-mcp/mcp-server/dist/server.js"]
# lazy = true
# prefix = "browser_"
